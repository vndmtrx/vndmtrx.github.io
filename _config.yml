# Site-wide settings
# ------------------
#
title: Vndmtrx
url: "https://vndmtrx.github.io"
lang: pt-BR

author:
  name: "Eduardo N. S. R."
  email: "vndmtrx@duck.com"
  tagline: "Vi Veri Vniversum Vivvs Vici"

#
# The `>` after `description:` means to ignore line-breaks until next key. If
#   you wish to omit the line-break after the end of text, use `>-` instead.
description: >
  Um blog com a proposta de falar sobre vários assuntos, desde desenvolvimento,
  passando por infra, devops, hacktivismo e até sobre conspirações alienígenas e
  portais circulares que permitem viagem a outros planetas.
  <br/><br/>Inclusive, se a criptografia fosse proibida, <em>fbzragr bf sbenf qn yrv grevnz cevinpvqnqr</em>...

# Build settings
# --------------
# Plugins
plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-sitemap
 - jekyll-target-blank
 - jekyll-gfm-admonitions
 - jekyll-paginate-v2

gfm_admonitions:
  inject_css: false

sass:
  quiet_deps: true

kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

pagination:
  enabled: true
  per_page: 3
  permalink: '/page/:num/'
  title: ':title - Página :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

autopages:
  enabled: true
  categories:
    layouts:
      - category.html
    title: ':cat'
    permalink: '/categorias/:cat/'
    slugify:
      mode: 'latin'
  collections:
    enabled: false
  tags:
    layouts:
      - tag.html
    title: ':tag'
    permalink: '/tags/:tag/'
    slugify:
      mode: 'latin'

# Minima-specific settings (applicable to Minima v3 and above only)
# -----------------------------------------------------------------
#
#  *All described config keys below should be nested under the top-level
#   `minima` key.*
#
minima:
#   Minima skin selection. Available skins are:
#     * classic            Default, light color scheme.
#     * dark               Dark variant of the classic skin.
#     * auto               Adaptive skin based on the classic and dark skins.
#     * solarized-light    Light variant of solarized color scheme.
#     * solarized-dark     Dark variant of solarized color scheme.
#     * solarized          Adaptive skin for solarized color scheme skins.
  skin: auto
#
#   Specific pages for site navigation.
#     If you wish to link only specific pages in the site-navigation, use this
#     and list the `path` property (as represented via Liquid) of the pages in
#     the order they should be rendered.
  nav_pages:
    - categorias.html
    - tutoriais.html
    - tags.html
    - about.md
#
#   Set to `true` to show excerpts on the homepage.
  show_excerpts: true
#
#   Minima date format.
#     The default value is "%b %d, %Y" (e.g. Nov 14, 2023).
#     Refer to https://shopify.github.io/liquid/filters/date/ for valid values
  date_format: "%d/%m/%Y às %H:%M"
#
#   Social Media Links.
#     Renders icons via Font Awesome Free webfonts CDN, based on ordered list of
#     entries. Valid entry keys:
#       * title    Tooltip rendered on hovering over icon.
#       * icon     Font Awesome icon id. `github` corresponds to `fa-github`.
#       * url      Full URL of social profile.
  social_links:
    - title: Github
      icon: github
      url: "https://github.com/vndmtrx"
    - title: Mastodon
      icon: mastodon
      url: "https://tech.lgbt/@vndmtrx"
    - title: Linkedin
      icon: linkedin
      url: "https://www.linkedin.com/in/eduardorolim/"
    - title: ORCID
      icon: orcid
      url: "https://orcid.org/0009-0006-5569-1816"
#
#   Hide syndication feed subscription link.
#     RSS / Atom feed link is always rendered as the last item of social-links
#     list. Set below key to `true` to not have the link to feed rendered as
#     part of social-links list.
  hide_site_feed_link: false
