---
layout: base
---

<section>
  {{ content }}

  {% if paginator.posts %}
    {% assign posts = paginator.posts %}
  {% else %}
    {% assign posts = site.posts %}
  {% endif %}

  {%- if posts.size > 0 -%}
    {%- if page.list_title -%}
      <h2>{{ page.list_title }}</h2>
    {%- endif -%}
    
    {% include post-list.html posts=posts %}
  {%- endif -%}
</section>
