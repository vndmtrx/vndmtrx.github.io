openssh:
  title: "OpenSSH na Prática"
  slug: "openssh"
  url: "/tutoriais/openssh/"
  icon: "fas fa-terminal"
  status: "Concluída"
  description: "Guia profundo sobre o protocolo mais essencial da infraestrutura: geração segura de chaves ed25519/GPG, túneis e port forwarding, eliminação do TOFU com Autoridade Certificadora (CA) e autenticação centralizada com LDAP e SSSD."

