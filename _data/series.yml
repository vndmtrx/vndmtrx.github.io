      title: "Certificados e PKI (Implementação)"
    - part: 7
      title: "O Balanceador de Carga (HAProxy e Keepalived)"
    - part: 8
      title: "O Container Runtime e o kubelet"
    - part: 9
      title: "A Evolução Arquitetural: de Binários a Static Pods"
    - part: 10
      title: "O Cluster etcd"
    - part: 11
      title: "O kube-apiserver (Static Pod)"
    - part: 12
      title: "Controller Manager e Scheduler (Static Pods)"
    - part: 13
      title: "O Bastion Host (kubox) e as Ferramentas de Operação"
    - part: 14
      title: "O Cluster Ganha Vida (CNI + CoreDNS + kube-proxy)"
    - part: 15
      title: "Armazenamento: NFS, Volumes Persistentes e StorageClass"
    - part: 16
      title: "Gateway API e Exposição de Serviços"
    - part: 17
      title: "Observabilidade (Prometheus + Grafana + Headlamp)"
    - part: 18
      title: "Labels, Taints e Primeiras Aplicações (Rootless)"
    - part: 19
      title: "Autoscaling (VPA + HPA + Testes de Carga)"
    - part: 20
      title: "Conformidade e Validação Final"
    - part: E1
      title: "SELinux e Kubernetes"
    - part: E2
      title: "CNI Alternativo (Canal - Flannel + Calico)"
    - part: E3
      title: "Container Runtime Alternativo (containerd)"
    - part: E4
      title: "Acesso Remoto com Túneis SSH"
    - part: E5
      title: "E agora, produção? (Entre o Laboratório e a Vida Real)"

conteineres:
  title: "Contêineres de Cabo a Rabo"
  slug: "conteineres"
  url: "/tutoriais/conteineres/"
  icon: "fas fa-box-open"
  description: "Uma imersão completa no universo dos contêineres: da pré-história do chroot e namespaces do kernel Linux até o uso moderno de Docker, Docker Compose, Podman e arquitetura OCI."

openssh:
  title: "OpenSSH na Prática"
  slug: "openssh"
  url: "/tutoriais/openssh/"
  icon: "fas fa-terminal"
  description: "Guia profundo sobre o protocolo mais essencial da infraestrutura: geração segura de chaves ed25519/GPG, túneis e port forwarding, eliminação do TOFU com Autoridade Certificadora (CA) e autenticação centralizada com LDAP e SSSD."

elixir:
  title: "Aprendendo Elixir"
  slug: "elixir"
  url: "/tutoriais/elixir/"
  icon: "fas fa-tint"
  description: "Anotações e conceitos práticos sobre a linguagem Elixir e a máquina virtual BEAM: imutabilidade, pattern matching expressivo e organização modular de projetos com Umbrella apps."

