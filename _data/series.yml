spring-boot:
  title: "Spring Boot Tutorial"
  slug: "spring-boot"
  url: "/tutoriais/spring-boot/"
  icon: "fas fa-leaf"
  status: "Em andamento"
  total_planned: 17
  repo: "https://github.com/vndmtrx/estudos_springboot"
  description: "Construção progressiva de uma API backend moderna de produção com Spring Boot e Java 26, explorando arquitetura de software, 12-Factor App, persistência avançada com Postgres 18, contratos OpenAPI, resiliência, observabilidade e Kubernetes."
  future_parts:
    - part: 4
      title: "Refinamento e Contratos (O fim do JPA no Controller)"
    - part: 5
      title: "Persistência Real com Postgres 18"
    - part: 6
      title: "Contratos e Documentação Viva (Design-First vs SpringDoc OpenAPI)"
    - part: 7
      title: "Arquitetura: RESTful vs RPC (HATEOAS)"
    - part: 8
      title: "Testes de Integração e Specs (BDD e Testcontainers)"
    - part: 9
      title: "Paginação, Filtros Dinâmicos e o Novo Verbo HTTP QUERY (RFC 9734)"
    - part: 10
      title: "Calendário, Agendamento e Background Jobs"
    - part: 11
      title: "Usuários, Security e Auditoria Completa (JWT e Hibernate Envers)"
    - part: 12
      title: "Observabilidade: Actuator, Prometheus e OpenTelemetry"
    - part: 13
      title: "Caches e Resiliência com Redis e Resilience4J"
    - part: 14
      title: "Containerização e o Caminho para o Kubernetes"
    - part: 15
      title: "Bônus: Mensageria Distribuída e EDA (RabbitMQ / Kafka)"
    - part: 16
      title: "Bônus: Particionamento e Data Tiering com PostgreSQL"
    - part: 17
      title: "Bônus: Re-hidratação, Operações em Dados Frios e Ciclo de Vida"

