<!-- Indicador de Progresso de Leitura (LGBT Rainbow) -->
<div id="reading-progress" class="reading-progress-bar" aria-hidden="true">
  <div id="reading-progress-fill" class="reading-progress-fill"></div>
</div>

<script>
  (function () {
    var fill = document.getElementById('reading-progress-fill');
    if (!fill) return;

    var ticking = false;

    function updateProgress() {
      var docEl = document.documentElement;
      var body = document.body;
      var scrollTop = window.scrollY || docEl.scrollTop || body.scrollTop || 0;
      var scrollHeight = (docEl.scrollHeight || body.scrollHeight) - window.innerHeight;
      var progress = 0;
      if (scrollHeight > 0) {
        progress = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
      }
      fill.style.width = progress + '%';
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(updateProgress);
        ticking = true;
      }
    }, { passive: true });

    window.addEventListener('resize', updateProgress, { passive: true });
    document.addEventListener('DOMContentLoaded', updateProgress);
  })();
</script>
