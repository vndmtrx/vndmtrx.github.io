<div class="nav-items">
  {%- for path in include.paths -%}
  {%- assign hyperpage = site.pages | where: "path", path | first -%}
  {%- assign nav_label = hyperpage.nav_title | default: hyperpage.title -%}
  {%- if nav_label %}
  <a class="nav-item" href="{{ hyperpage.url | relative_url }}">{{ nav_label | escape }}</a>
  {%- endif -%}
  {%- endfor %}
</div>
