<!-- Mermaid.js integration for vndmtrx.github.io -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  function getTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default';
  }

  let renderCounter = 0;

  async function renderDiagram(container) {
    const src = container.getAttribute('data-mermaid-src');
    if (!src) return;
    try {
      const id = 'mermaid-svg-' + (++renderCounter);
      const { svg } = await mermaid.render(id, src);
      container.innerHTML = svg;
      const svgEl = container.querySelector('svg');
      if (svgEl) {
        // Impede que diagramas pequenos sejam esticados desproporcionalmente para 100% da largura
        svgEl.style.maxWidth = '100%';
        svgEl.style.height = 'auto';
        if (svgEl.getAttribute('viewBox')) {
          const parts = svgEl.getAttribute('viewBox').split(' ');
          if (parts.length === 4) {
            const naturalWidth = parseFloat(parts[2]);
            if (naturalWidth && naturalWidth < 700) {
              svgEl.style.maxWidth = naturalWidth + 'px';
            }
          }
        }
      }
    } catch (err) {
      console.error('Falha ao renderizar diagrama Mermaid:', err);
    }
  }

  async function renderAll() {
    mermaid.initialize({
      startOnLoad: false,
      theme: getTheme(),
      fontFamily: 'Source Code Pro, monospace',
      fontSize: 13,
      securityLevel: 'loose',
      themeVariables: {
        fontSize: '13px',
        fontFamily: 'Source Code Pro, monospace'
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis',
        wrappingWidth: 500,
        nodeSpacing: 30,
        rankSpacing: 35,
        padding: 14
      },
      sequence: {
        useMaxWidth: true,
        actorMargin: 50,
        boxMargin: 10,
        boxTextMargin: 5,
        noteMargin: 10,
        messageMargin: 35
      }
    });

    const diagrams = document.querySelectorAll('.mermaid[data-mermaid-src]');
    for (const diagram of diagrams) {
      await renderDiagram(diagram);
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    // Localiza blocos ```mermaid processados pelo Kramdown / Rouge
    const codeBlocks = document.querySelectorAll('code.language-mermaid');

    codeBlocks.forEach((code) => {
      const wrapper = code.closest('.highlighter-rouge') || code.closest('pre') || code;
      const outerContainer = document.createElement('div');
      outerContainer.className = 'mermaid-wrapper';

      const mermaidDiv = document.createElement('div');
      mermaidDiv.className = 'mermaid';
      const rawText = code.textContent.trim();
      mermaidDiv.setAttribute('data-mermaid-src', rawText);

      outerContainer.appendChild(mermaidDiv);
      wrapper.parentNode.replaceChild(outerContainer, wrapper);
    });

    await renderAll();

    // Observa mudanças no data-theme para re-renderizar diagramas ao alternar claro/escuro
    const observer = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.attributeName === 'data-theme') {
          renderAll();
          break;
        }
      }
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  });
</script>
